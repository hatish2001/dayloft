name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install pinned dependencies
        run: bundle exec pod install --project-directory=SelfControl
      - name: Verify release versions
        run: python3 scripts/verify-versions.py
      - name: Original contracts and new native tests
        run: ./scripts/test.sh
      - name: Build both release architectures
        run: ./scripts/build-universal.sh
      - name: Verify signed update rejection
        run: ./scripts/test-update-signing.sh
      - name: Check public source hygiene
        run: python3 scripts/audit-source.py
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            artifacts/tests.log
            artifacts/universal-build.log
            artifacts/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
